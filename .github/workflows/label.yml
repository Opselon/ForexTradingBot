# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

name: Labeler
on: [pull_request]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Build trusted label configuration
      shell: bash
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.github"
        cat > "$GITHUB_WORKSPACE/.github/labeler.yml" <<'EOF'
        code:
          - any: ['**/*.cs', '**/*.csproj', '**/*.sln']
        ci:
          - any: ['.github/workflows/**', 'Dockerfile', '.dockerignore']
        docker:
          - any: ['Dockerfile', 'docker-compose*.yml', 'scripts/database/**']
        documentation:
          - any: ['**/*.md', 'docs/**']
        dependencies:
          - any: ['**/packages.lock.json', 'global.json']
        EOF
    - uses: actions/labeler@v7
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml
