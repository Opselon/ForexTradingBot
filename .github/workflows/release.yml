{
  "name": "✨ Multi-Layer Build & Release (Final Fix)",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "master"
      ],
      "tags": [
        "v*.*.*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "job_01_checkout_and_setup": {
      "name": "📦 01 Checkout & Setup",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout Source Code",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "💨 Cache NuGet Packages",
          "uses": "actions/cache@v6",
          "with": {
            "path": "~/.nuget/packages",
            "key": "${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}",
            "restore-keys": "${{ runner.os }}-nuget-\n"
          }
        }
      ]
    },
    "job_02_restore_dependencies": {
      "name": "⬇️ 02 Restore Dependencies",
      "needs": "job_01_checkout_and_setup",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Restore Project Dependencies",
          "run": "dotnet restore"
        },
        {
          "name": "🔐 Dependency vulnerability gate",
          "shell": "bash",
          "run": "set -euo pipefail\nreport=\"$RUNNER_TEMP/vulnerable-packages.txt\"\ndotnet list ForexTradingBot.sln package --vulnerable --include-transitive 2>&1 | tee \"$report\"\nif grep -Eqi 'has (the following )?vulnerabilit|severity:[[:space:]]*(critical|high|moderate|low)' \"$report\"; then echo 'Known vulnerable NuGet package detected. Release is blocked.'; exit 1; fi"
        }
      ]
    },
    "job_03_build_linux": {
      "name": "🏗️ 03 Build Linux",
      "needs": "job_02_restore_dependencies",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🔨 Build Solution",
          "run": "dotnet build --configuration Release --no-restore"
        }
      ]
    },
    "job_04_test_unit": {
      "name": "🧪 04 Run Unit Tests (Lightweight)",
      "needs": "job_03_build_linux",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🚀 Run Unit Tests",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release --filter Category=Unit"
        }
      ]
    },
    "job_05_test_integration_db": {
      "name": "🐘 05 Run Integration Tests (Postgres)",
      "needs": "job_04_test_unit",
      "runs-on": "ubuntu-latest",
      "services": {
        "postgres": {
          "image": "postgres:15",
          "env": {
            "POSTGRES_USER": "testuser",
            "POSTGRES_PASSWORD": "testpassword",
            "POSTGRES_DB": "integration_tests"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
        }
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🐘 Ensure pg_trgm extension exists",
          "run": "sudo apt-get update\nsudo apt-get install -y postgresql-client\nPGPASSWORD=testpassword psql -h localhost -U testuser -d integration_tests -c \"CREATE EXTENSION IF NOT EXISTS pg_trgm;\"\n"
        },
        {
          "name": "🚀 Run Integration Tests (DB)",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release",
          "env": {
            "ConnectionStrings__DefaultConnection": "Host=localhost;Port=5432;Database=integration_tests;Username=testuser;Password=testpassword",
            "TEST_ENVIRONMENT": "Full"
          }
        }
      ]
    },
    "job_06_test_integration_redis": {
      "name": "🔴 06 Run Integration Tests (Redis/Hangfire)",
      "needs": "job_05_test_integration_db",
      "runs-on": "ubuntu-latest",
      "services": {
        "redis": {
          "image": "redis:7",
          "ports": [
            "6379:6379"
          ],
          "options": "--health-cmd \"redis-cli ping\" --health-interval 10s --health-timeout 5s --health-retries 5"
        }
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🚀 Run Redis Integration Tests",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release --filter Category=Redis",
          "env": {
            "ConnectionStrings__Redis": "localhost:6379",
            "TEST_ENVIRONMENT": "Full"
          }
        }
      ]
    },
    "job_07_test_smoke_linux": {
      "name": "💨 07 Run Linux Smoke Test",
      "needs": "job_06_test_integration_redis",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Build Application",
          "run": "dotnet build WebAPI/WebAPI.csproj -c Debug"
        },
        {
          "name": "✅ Run Smoke Test (with Logging)",
          "shell": "bash",
          "run": "echo \"Starting application in the background for smoke test...\"\n\n# FIX: Correct path to DLL is inside WebAPI folder\nnohup dotnet WebAPI/bin/Debug/net9.0/WebAPI.dll --urls \"http://localhost:5000\" > app_output.log 2>&1 &\nAPP_PID=$!\necho \"App started with PID $APP_PID\"\n\necho \"Waiting for application to start (polling http://localhost:5000/healthz)...\"\n\nfor i in {1..30}; do\n  if curl -s --fail http://localhost:5000/healthz > /dev/null; then\n    echo \"✅ Health check passed!\"\n    kill \"$APP_PID\" || true\n    exit 0\n  fi\n  # Check if process is still running\n  if ! kill -0 \"$APP_PID\" 2>/dev/null; then\n    echo \"❌ Application crashed immediately!\"\n    echo \"===== APP LOGS =====\"\n    cat app_output.log\n    exit 1\n  fi\n  echo \"Health check failed. Retrying in 1 second...\"\n  sleep 1\ndone\n\necho \"❌ Health check failed after 30 seconds.\"\necho \"===== APP LOGS (Timeout) =====\"\ncat app_output.log\nkill \"$APP_PID\" || true\nexit 1\n",
          "env": {
            "IsSmokeTest": "true",
            "ASPNETCORE_ENVIRONMENT": "Development",
            "ConnectionStrings__DefaultConnection": "Data Source=smoke_test.db",
            "TelegramPanel__BotToken": "123456:ABC-DEF1234567890"
          }
        }
      ]
    },
    "job_07b_end_user_e2e": {
      "name": "🧭 07 End-user E2E Release Gate",
      "needs": "job_06_test_integration_redis",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "⬇️ Restore solution",
          "run": "dotnet restore ForexTradingBot.sln"
        },
        {
          "name": "⬇️ Restore E2E project",
          "run": "dotnet restore tests/e2e/ForexTradingBot.EndToEnd.csproj"
        },
        {
          "name": "🏗️ Build solution",
          "run": "dotnet build ForexTradingBot.sln -c Release --no-restore"
        },
        {
          "name": "🏗️ Build E2E project",
          "run": "dotnet build tests/e2e/ForexTradingBot.EndToEnd.csproj -c Release --no-restore"
        },
        {
          "name": "🧪 Run full end-user E2E with SQL Server probe",
          "env": {
            "FOREXBOT_E2E_WITH_SQLSERVER": "1"
          },
          "run": "dotnet test tests/e2e/ForexTradingBot.EndToEnd.csproj -c Release --no-build --no-restore --logger \"console;verbosity=normal\""
        }
      ]
    },
    "job_08_publish_artifacts": {
      "name": "📦 08 Publish ${{ matrix.rid }}",
      "needs": [
        "job_07_test_smoke_linux",
        "job_07b_end_user_e2e"
      ],
      "runs-on": "${{ matrix.runner }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "rid": "linux-x64",
              "runner": "ubuntu-latest",
              "archive": "tar.gz",
              "dotnet_rid": "linux-x64"
            },
            {
              "rid": "linux-arm64",
              "runner": "ubuntu-latest",
              "archive": "tar.gz",
              "dotnet_rid": "linux-arm64"
            },
            {
              "rid": "win-x64",
              "runner": "windows-latest",
              "archive": "zip",
              "dotnet_rid": "win-x64"
            },
            {
              "rid": "win-arm64",
              "runner": "windows-latest",
              "archive": "zip",
              "dotnet_rid": "win-arm64"
            },
            {
              "rid": "osx-x64",
              "runner": "macos-latest",
              "archive": "tar.gz",
              "dotnet_rid": "osx-x64"
            },
            {
              "rid": "osx-arm64",
              "runner": "macos-latest",
              "archive": "tar.gz",
              "dotnet_rid": "osx-arm64"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "📦 Publish WebAPI (self-contained single-file)",
          "run": "dotnet publish WebAPI/WebAPI.csproj -c Release -r ${{ matrix.dotnet_rid }} --self-contained true -p:PublishSingleFile=true -o ./publish/api"
        },
        {
          "name": "📦 Publish CLI (self-contained single-file)",
          "run": "dotnet publish Cli/ForexTradingBot.Cli.csproj -c Release -r ${{ matrix.dotnet_rid }} --self-contained true -p:PublishSingleFile=true -o ./publish/cli"
        },
        {
          "name": "📋 Bundle CLI next to API + setup files",
          "shell": "bash",
          "run": "mkdir -p ./publish/bundle\ncp -R ./publish/api/. ./publish/bundle/\nmkdir -p ./publish/bundle/cli\ncp -R ./publish/cli/. ./publish/bundle/cli/\n# Setup scripts must stay executable in the archive.\ncp install.sh install.ps1 ./publish/bundle/ 2>/dev/null || true\ncp .env.example ./publish/bundle/ 2>/dev/null || true\ncp README.md ./publish/bundle/ 2>/dev/null || true\ncp QUICKSTART.md ./publish/bundle/ 2>/dev/null || true\ncp docker-compose.yml ./publish/bundle/ 2>/dev/null || true\ncp Dockerfile ./publish/bundle/ 2>/dev/null || true\ncp entrypoint.sh ./publish/bundle/ 2>/dev/null || true\nchmod 755 ./publish/bundle/install.sh ./publish/bundle/entrypoint.sh 2>/dev/null || true\nls -la ./publish/bundle | head -30\n"
        },
        {
          "name": "🏷️ Determine Artifact Name",
          "id": "artifact_name",
          "shell": "bash",
          "run": "if [[ \"${{ github.ref_type }}\" == \"tag\" ]]; then\n  ARTIFACT_FILENAME=\"ForexTradingBot-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.archive }}\"\nelse\n  SHORT_SHA=$(echo \"${{ github.sha }}\" | cut -c1-7)\n  ARTIFACT_FILENAME=\"ForexTradingBot-${SHORT_SHA}-${{ matrix.rid }}.${{ matrix.archive }}\"\nfi\necho \"ARTIFACT_FILENAME=${ARTIFACT_FILENAME}\" >> $GITHUB_ENV\n"
        },
        {
          "name": "🧱 Compress Artifact",
          "shell": "bash",
          "run": "if [[ \"${{ matrix.archive }}\" == \"zip\" ]]; then\n  7z a -tzip \"${{ env.ARTIFACT_FILENAME }}\" ./publish/bundle/*\nelse\n  tar -czvf \"${{ env.ARTIFACT_FILENAME }}\" -C ./publish/bundle .\nfi\n"
        },
        {
          "name": "⬆️ Upload Build Artifact",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "release-asset-${{ matrix.rid }}",
            "path": "${{ env.ARTIFACT_FILENAME }}"
          }
        }
      ]
    },
    "job_09_docker_meta": {
      "name": "🐳 09 Docker Metadata",
      "needs": [
        "job_07_test_smoke_linux",
        "job_07b_end_user_e2e"
      ],
      "runs-on": "ubuntu-latest",
      "outputs": {
        "tags": "${{ steps.docker_meta.outputs.tags }}",
        "labels": "${{ steps.docker_meta.outputs.labels }}",
        "version": "${{ steps.docker_meta.outputs.version }}"
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Docker Metadata",
          "id": "docker_meta",
          "uses": "docker/metadata-action@v6",
          "with": {
            "images": "ghcr.io/${{ github.repository }}",
            "tags": "type=sha,format=short,priority=10\ntype=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }},priority=20\ntype=ref,event=tag,priority=30\n"
          }
        }
      ]
    },
    "job_10_docker_build_test": {
      "name": "🏗️ 10 Docker Build & Test Image",
      "needs": [
        "job_09_docker_meta"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Set up Docker Buildx",
          "uses": "docker/setup-buildx-action@v4"
        },
        {
          "name": "Build Docker image (local-test)",
          "uses": "docker/build-push-action@v7",
          "with": {
            "context": ".",
            "file": "./Dockerfile",
            "push": false,
            "load": true,
            "tags": "local-smoketest:latest",
            "cache-from": "type=gha",
            "cache-to": "type=gha,mode=max"
          }
        },
        {
          "name": "Run Smoke Test on Docker Image",
          "timeout-minutes": 10,
          "shell": "bash",
          "run": "echo \"Starting test Postgres & Redis containers...\"\ndocker run --rm -d --name test_postgres \\\n  -e POSTGRES_USER=testuser \\\n  -e POSTGRES_PASSWORD=testpassword \\\n  -e POSTGRES_DB=smoke_tests \\\n  postgres:15\n\ndocker run --rm -d --name test_redis redis:7\n\necho \"Waiting for services to become healthy...\"\nsleep 10\n\necho \"Starting application container from local-smoketest:latest...\"\n# NOTE: Mapping host port 5000 to container port 5000\ndocker run --rm -d --name test_app \\\n  -p 5000:5000 \\\n  -e ASPNETCORE_URLS=http://+:5000 \\\n  -e IsSmokeTest=true \\\n  -e ASPNETCORE_ENVIRONMENT=Development \\\n  -e ConnectionStrings__DefaultConnection=\"Host=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' test_postgres);Port=5432;Database=smoke_tests;Username=testuser;Password=testpassword\" \\\n  -e ConnectionStrings__Redis=\"$(docker inspect -f '{{.NetworkSettings.IPAddress}}' test_redis):6379\" \\\n  -e TelegramPanel__BotToken=\"123456:ABC-DEF1234567890\" \\\n  local-smoketest:latest\n\necho \"Polling /healthz on container (http://localhost:5000/healthz)...\"\nfor i in {1..30}; do\n  if curl -s --fail http://localhost:5000/healthz > /dev/null; then\n    echo \"✅ Health check passed on Docker image!\"\n    docker stop test_app test_postgres test_redis\n    exit 0\n  fi\n  echo \"Health check failed. Retrying in 2 seconds...\"\n  sleep 2\ndone\n\necho \"❌ Docker image smoke test failed after 60 seconds.\"\necho \"===== test_app logs =====\"\ndocker logs test_app || true\ndocker stop test_app test_postgres test_redis || true\nexit 1\n"
        }
      ]
    },
    "job_12_docker_push": {
      "name": "⬆️ 12 Docker Push Image",
      "needs": [
        "job_10_docker_build_test",
        "job_09_docker_meta"
      ],
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "packages": "write",
        "id-token": "write",
        "attestations": "write"
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Set up Docker Buildx",
          "uses": "docker/setup-buildx-action@v4"
        },
        {
          "name": "🔑 Log in to GitHub Container Registry",
          "if": "${{ github.event_name == 'push' || github.event_name == 'create' }}",
          "uses": "docker/login-action@v4",
          "with": {
            "registry": "ghcr.io",
            "username": "${{ github.actor }}",
            "password": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "name": "🚀 Build and Push Docker image (Final Push)",
          "uses": "docker/build-push-action@v7",
          "with": {
            "context": ".",
            "file": "./Dockerfile",
            "push": true,
            "tags": "${{ needs.job_09_docker_meta.outputs.tags }}",
            "labels": "${{ needs.job_09_docker_meta.outputs.labels }}",
            "cache-from": "type=gha",
            "cache-to": "type=gha,mode=max",
            "provenance": false
          }
        }
      ]
    },
    "job_17_final_cleanup_artifacts": {
      "name": "⬇️ 17 Final Artifact Collection",
      "needs": [
        "job_08_publish_artifacts",
        "job_12_docker_push"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Download all release assets",
          "uses": "actions/download-artifact@v8",
          "with": {
            "path": "./release-assets"
          }
        },
        {
          "name": "🪜 Flatten artifact directories",
          "shell": "bash",
          "run": "set -euo pipefail\n# download-artifact places each artifact in its own subdirectory\n# (release-assets/<artifact-name>/...). Flatten everything to a single level so\n# the release upload glob matches the archives directly.\nmkdir -p ./flat\nfind ./release-assets -type f -print0 | while IFS= read -r -d '' f; do\n  base=$(basename \"$f\")\n  # collisions are not expected: each artifact name is unique\n  cp -- \"$f\" \"./flat/$base\"\ndone\nrm -rf ./release-assets\nmv ./flat ./release-assets\nls -la ./release-assets\n"
        },
        {
          "name": "🔐 Generate SHA-256 checksums",
          "shell": "bash",
          "run": "set -euo pipefail\nfind ./release-assets -type f -not -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > ./release-assets/SHA256SUMS.txt\ncat ./release-assets/SHA256SUMS.txt"
        },
        {
          "name": "📤 Publish flattened release bundle",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "final-release-assets",
            "path": "./release-assets/*",
            "retention-days": 1
          }
        }
      ]
    },
    "job_18_create_release": {
      "name": "🚀 18 Create GitHub Release",
      "if": "startsWith(github.ref, 'refs/tags/')",
      "needs": "job_17_final_cleanup_artifacts",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "📥 Download flattened release bundle",
          "uses": "actions/download-artifact@v8",
          "with": {
            "name": "final-release-assets",
            "path": "./release-assets"
          }
        },
        {
          "name": "Create GitHub Release",
          "uses": "softprops/action-gh-release@v3",
          "with": {
            "files": "./release-assets/ForexTradingBot-*-linux-x64.tar.gz\n./release-assets/ForexTradingBot-*-linux-arm64.tar.gz\n./release-assets/ForexTradingBot-*-win-x64.zip\n./release-assets/ForexTradingBot-*-win-arm64.zip\n./release-assets/ForexTradingBot-*-osx-x64.tar.gz\n./release-assets/ForexTradingBot-*-osx-arm64.tar.gz\n./release-assets/SHA256SUMS.txt",
            "name": "Release ${{ github.ref_name }}",
            "body": "## ForexTradingBot ${{ github.ref_name }}\n\nSelf-contained single-file builds for all supported platforms (no .NET runtime required):\n\n- Linux: linux-x64, linux-arm64\n- Windows: win-x64, win-arm64\n- macOS: osx-x64 (Intel), osx-arm64 (Apple Silicon)\n\nEach archive contains:\n- The **WebAPI** server\n- The **CLI** tool (`forexbot`) under `cli/`\n- One-command installers: `install.sh` (Linux/macOS) and `install.ps1` (Windows)\n- `docker-compose.yml` + `Dockerfile` for the Docker path (PostgreSQL + Redis included)\n\n### Quick start\n\n**Linux / macOS**\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/Opselon/ForexTradingBot/master/install.sh | bash\n```\n\n**Windows (PowerShell)**\n\n```powershell\niwr -UseBasicParsing https://raw.githubusercontent.com/Opselon/ForexTradingBot/master/install.ps1 | iex\n```\n\nThe installer installs Docker / PostgreSQL / Redis if missing, or runs natively with the .NET 9 SDK.\n\n### Docker\n\n```bash\ndocker pull ghcr.io/opselon/forextradingbot:${{ github.ref_name }}\n```\n\nSHA-256 checksums: see `SHA256SUMS.txt`.",
            "draft": false,
            "prerelease": false
          },
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        }
      ]
    }
  }
}