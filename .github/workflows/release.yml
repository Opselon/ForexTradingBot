{
  "name": "✨ Multi-Layer Build & Release (Final Fix)",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "master"
      ],
      "tags": [
        "v*.*.*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "job_01_checkout_and_setup": {
      "name": "📦 01 Checkout & Setup",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout Source Code",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "💨 Cache NuGet Packages",
          "uses": "actions/cache@v6",
          "with": {
            "path": "~/.nuget/packages",
            "key": "${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}",
            "restore-keys": "${{ runner.os }}-nuget-\n"
          }
        }
      ]
    },
    "job_02_restore_dependencies": {
      "name": "⬇️ 02 Restore Dependencies",
      "needs": "job_01_checkout_and_setup",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Restore Project Dependencies",
          "run": "dotnet restore"
        },
        {
          "name": "🔐 Dependency vulnerability gate",
          "shell": "bash",
          "run": "set -euo pipefail\nreport=\"$RUNNER_TEMP/vulnerable-packages.txt\"\ndotnet list ForexTradingBot.sln package --vulnerable --include-transitive 2>&1 | tee \"$report\"\nif grep -Eqi 'has (the following )?vulnerabilit|severity:[[:space:]]*(critical|high|moderate|low)' \"$report\"; then echo 'Known vulnerable NuGet package detected. Release is blocked.'; exit 1; fi"
        }
      ]
    },
    "job_03_build_linux": {
      "name": "🏗️ 03 Build Linux",
      "needs": "job_02_restore_dependencies",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🔨 Build Solution",
          "run": "dotnet build --configuration Release --no-restore"
        }
      ]
    },
    "job_04_test_unit": {
      "name": "🧪 04 Run Unit Tests (Lightweight)",
      "needs": "job_03_build_linux",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🚀 Run Unit Tests",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release --filter Category=Unit"
        }
      ]
    },
    "job_05_test_integration_db": {
      "name": "🐘 05 Run Integration Tests (Postgres)",
      "needs": "job_04_test_unit",
      "runs-on": "ubuntu-latest",
      "services": {
        "postgres": {
          "image": "postgres:15",
          "env": {
            "POSTGRES_USER": "testuser",
            "POSTGRES_PASSWORD": "testpassword",
            "POSTGRES_DB": "integration_tests"
          },
          "ports": [
            "5432:5432"
          ],
          "options": "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
        }
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🐘 Ensure pg_trgm extension exists",
          "run": "sudo apt-get update\nsudo apt-get install -y postgresql-client\nPGPASSWORD=testpassword psql -h localhost -U testuser -d integration_tests -c \"CREATE EXTENSION IF NOT EXISTS pg_trgm;\"\n"
        },
        {
          "name": "🚀 Run Integration Tests (DB)",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release",
          "env": {
            "ConnectionStrings__DefaultConnection": "Host=localhost;Port=5432;Database=integration_tests;Username=testuser;Password=testpassword",
            "TEST_ENVIRONMENT": "Full"
          }
        }
      ]
    },
    "job_06_test_integration_redis": {
      "name": "🔴 06 Run Integration Tests (Redis/Hangfire)",
      "needs": "job_05_test_integration_db",
      "runs-on": "ubuntu-latest",
      "services": {
        "redis": {
          "image": "redis:7",
          "ports": [
            "6379:6379"
          ],
          "options": "--health-cmd \"redis-cli ping\" --health-interval 10s --health-timeout 5s --health-retries 5"
        }
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🚀 Run Redis Integration Tests",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release --filter Category=Redis",
          "env": {
            "ConnectionStrings__Redis": "localhost:6379",
            "TEST_ENVIRONMENT": "Full"
          }
        }
      ]
    },
"job_07_test_smoke_linux": {
      "name": "💨 07 Run Linux Smoke Test",
      "needs": "job_06_test_integration_redis",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Build Application",
          "run": "dotnet build WebAPI/WebAPI.csproj -c Debug"
        },
        {
          "name": "✅ Run Smoke Test (with Logging)",
          "shell": "bash",
          "run": "echo \"Starting application in the background for smoke test...\"\n\n# FIX: Correct path to DLL is inside WebAPI folder\nnohup dotnet WebAPI/bin/Debug/net9.0/WebAPI.dll --urls \"http://localhost:5000\" > app_output.log 2>&1 &\nAPP_PID=$!\necho \"App started with PID $APP_PID\"\n\necho \"Waiting for application to start (polling http://localhost:5000/healthz)...\"\n\nfor i in {1..30}; do\n  if curl -s --fail http://localhost:5000/healthz > /dev/null; then\n    echo \"✅ Health check passed!\"\n    kill \"$APP_PID\" || true\n    exit 0\n  fi\n  # Check if process is still running\n  if ! kill -0 \"$APP_PID\" 2>/dev/null; then\n    echo \"❌ Application crashed immediately!\"\n    echo \"===== APP LOGS =====\"\n    cat app_output.log\n    exit 1\n  fi\n  echo \"Health check failed. Retrying in 1 second...\"\n  sleep 1\ndone\n\necho \"❌ Health check failed after 30 seconds.\"\necho \"===== APP LOGS (Timeout) =====\"\ncat app_output.log\nkill \"$APP_PID\" || true\nexit 1\n",
          "env": {
            "IsSmokeTest": "true",
            "ASPNETCORE_ENVIRONMENT": "Development",
            "ConnectionStrings__DefaultConnection": "Data Source=smoke_test.db",
            "TelegramPanel__BotToken": "123456:ABC-DEF1234567890"
          }
        }
      ]
    },
    "job_07b_end_user_e2e": {
      "name": "🧭 07 End-user E2E Release Gate",
      "needs": "job_06_test_integration_redis",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 45,
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "⬇️ Restore solution",
          "run": "dotnet restore ForexTradingBot.sln"
        },
        {
          "name": "⬇️ Restore E2E project",
          "run": "dotnet restore tests/e2e/ForexTradingBot.EndToEnd.csproj"
        },
        {
          "name": "🏗️ Build solution",
          "run": "dotnet build ForexTradingBot.sln -c Release --no-restore"
        },
        {
          "name": "🏗️ Build E2E project",
          "run": "dotnet build tests/e2e/ForexTradingBot.EndToEnd.csproj -c Release --no-restore"
        },
        {
          "name": "🧪 Run full end-user E2E with SQL Server probe",
          "env": {
            "FOREXBOT_E2E_WITH_SQLSERVER": "1"
          },
          "run": "dotnet test tests/e2e/ForexTradingBot.EndToEnd.csproj -c Release --no-build --no-restore --logger \"console;verbosity=normal\""
        }
      ]
    },
    "job_08_publish_linux_artifact": {
      "name": "🐧 08 Publish Linux Artifact",
      "needs": [
        "job_07_test_smoke_linux",
        "job_07b_end_user_e2e"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "📦 Publish application",
          "run": "dotnet publish WebAPI/WebAPI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish"
        },
        {
          "name": "🏷️ Determine Artifact Name",
          "id": "artifact_name",
          "shell": "bash",
          "run": "if [[ \"${{ github.ref_type }}\" == \"tag\" ]]; then\n  ARTIFACT_FILENAME=\"ForexTradingBot-${{ github.ref_name }}-linux-x64.tar.gz\"\nelse\n  SHORT_SHA=$(echo \"${{ github.sha }}\" | cut -c1-7)\n  ARTIFACT_FILENAME=\"ForexTradingBot-${SHORT_SHA}-linux-x64.tar.gz\"\nfi\necho \"ARTIFACT_FILENAME=${ARTIFACT_FILENAME}\" >> $GITHUB_ENV\n"
        },
        {
          "name": "Compress Artifact",
          "run": "tar -czvf \"${{ env.ARTIFACT_FILENAME }}\" -C ./publish ."
        },
        {
          "name": "⬆️ Upload Build Artifact",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "release-asset-linux-x64",
            "path": "${{ env.ARTIFACT_FILENAME }}"
          }
        }
      ]
    },
    "job_09_docker_meta": {
      "name": "🐳 09 Docker Metadata",
      "needs": [
        "job_07_test_smoke_linux",
        "job_07b_end_user_e2e"
      ],
      "runs-on": "ubuntu-latest",
      "outputs": {
        "tags": "${{ steps.docker_meta.outputs.tags }}",
        "labels": "${{ steps.docker_meta.outputs.labels }}",
        "version": "${{ steps.docker_meta.outputs.version }}"
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Docker Metadata",
          "id": "docker_meta",
          "uses": "docker/metadata-action@v6",
          "with": {
            "images": "ghcr.io/${{ github.repository }}",
            "tags": "type=sha,format=short,priority=10\ntype=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }},priority=20\ntype=ref,event=tag,priority=30\n"
          }
        }
      ]
    },
    "job_10_docker_build_test": {
      "name": "🏗️ 10 Docker Build & Test Image",
      "needs": [
        "job_09_docker_meta"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Set up Docker Buildx",
          "uses": "docker/setup-buildx-action@v4"
        },
        {
          "name": "Build Docker image (local-test)",
          "uses": "docker/build-push-action@v7",
          "with": {
            "context": ".",
            "file": "./Dockerfile",
            "push": false,
            "load": true,
            "tags": "local-smoketest:latest",
            "cache-from": "type=gha",
            "cache-to": "type=gha,mode=max"
          }
        },
        {
          "name": "Run Smoke Test on Docker Image",
          "timeout-minutes": 10,
          "shell": "bash",
          "run": "echo \"Starting test Postgres & Redis containers...\"\ndocker run --rm -d --name test_postgres \\\n  -e POSTGRES_USER=testuser \\\n  -e POSTGRES_PASSWORD=testpassword \\\n  -e POSTGRES_DB=smoke_tests \\\n  postgres:15\n\ndocker run --rm -d --name test_redis redis:7\n\necho \"Waiting for services to become healthy...\"\nsleep 10\n\necho \"Starting application container from local-smoketest:latest...\"\n# NOTE: Mapping host port 5000 to container port 5000\ndocker run --rm -d --name test_app \\\n  -p 5000:5000 \\\n  -e ASPNETCORE_URLS=http://+:5000 \\\n  -e IsSmokeTest=true \\\n  -e ASPNETCORE_ENVIRONMENT=Development \\\n  -e ConnectionStrings__DefaultConnection=\"Host=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' test_postgres);Port=5432;Database=smoke_tests;Username=testuser;Password=testpassword\" \\\n  -e ConnectionStrings__Redis=\"$(docker inspect -f '{{.NetworkSettings.IPAddress}}' test_redis):6379\" \\\n  -e TelegramPanel__BotToken=\"123456:ABC-DEF1234567890\" \\\n  local-smoketest:latest\n\necho \"Polling /healthz on container (http://localhost:5000/healthz)...\"\nfor i in {1..30}; do\n  if curl -s --fail http://localhost:5000/healthz > /dev/null; then\n    echo \"✅ Health check passed on Docker image!\"\n    docker stop test_app test_postgres test_redis\n    exit 0\n  fi\n  echo \"Health check failed. Retrying in 2 seconds...\"\n  sleep 2\ndone\n\necho \"❌ Docker image smoke test failed after 60 seconds.\"\necho \"===== test_app logs =====\"\ndocker logs test_app || true\ndocker stop test_app test_postgres test_redis || true\nexit 1\n"
        }
      ]
    },
   "job_12_docker_push": {
      "name": "⬆️ 12 Docker Push Image",
      "needs": [
        "job_10_docker_build_test",
        "job_09_docker_meta"
      ],
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "packages": "write",
        "id-token": "write",
        "attestations": "write"
      },
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Set up Docker Buildx",
          "uses": "docker/setup-buildx-action@v4"
        },
        {
          "name": "🔑 Log in to GitHub Container Registry",
          "if": "${{ github.event_name == 'push' || github.event_name == 'create' }}",
          "uses": "docker/login-action@v4",
          "with": {
            "registry": "ghcr.io",
            "username": "${{ github.actor }}",
            "password": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "name": "🚀 Build and Push Docker image (Final Push)",
          "uses": "docker/build-push-action@v7",
          "with": {
            "context": ".",
            "file": "./Dockerfile",
            "push": true,
            "tags": "${{ needs.job_09_docker_meta.outputs.tags }}",
            "labels": "${{ needs.job_09_docker_meta.outputs.labels }}",
            "cache-from": "type=gha",
            "cache-to": "type=gha,mode=max",
            "provenance": false 
          }
        }
      ]
    },
"job_13_build_win_package": {
      "name": "🪟 13 Windows Build, Test, & Package",
      "needs": [
        "job_02_restore_dependencies",
        "job_07b_end_user_e2e"
      ],
      "runs-on": "windows-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "📦 Publish application (Self-Contained)",
          "run": "dotnet publish WebAPI/WebAPI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish"
        },
        {
          "name": "🧪 Run Unit & Integration Tests (Lightweight)",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release --verbosity normal",
          "env": {
            "ConnectionStrings__DefaultConnection": "Data Source=lightweight_test.db",
            "TelegramPanel__BotToken": "123456:ABC-DEF1234567890",
            "TEST_ENVIRONMENT": "Lightweight",
            "ASPNETCORE_ENVIRONMENT": "Development"
          }
        },
        {
          "name": "🏷️ Determine Artifact Name",
          "id": "artifact_name",
          "shell": "bash",
          "run": "if [[ \"${{ github.ref_type }}\" == \"tag\" ]]; then\n  ARTIFACT_FILENAME=\"ForexTradingBot-${{ github.ref_name }}-win-x64.zip\"\nelse\n  SHORT_SHA=$(echo \"${{ github.sha }}\" | cut -c1-7)\n  ARTIFACT_FILENAME=\"ForexTradingBot-${SHORT_SHA}-win-x64.zip\"\nfi\necho \"ARTIFACT_FILENAME=${ARTIFACT_FILENAME}\" >> $GITHUB_ENV\n"
        },
        {
          "name": "Compress Artifact",
          "shell": "pwsh",
          "run": "Compress-Archive -Path ./publish/* -DestinationPath \"${{ env.ARTIFACT_FILENAME }}\""
        },
        {
          "name": "⬆️ Upload Build Artifact",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "release-asset-win-x64",
            "path": "${{ env.ARTIFACT_FILENAME }}"
          }
        }
      ]
    },
    "job_14_package_win_artifact": {
      "name": "⬆️ 14 Skip (Merged with 13)",
      "needs": "job_13_build_win_package",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Placeholder for Merged Step",
          "run": "echo \"Step 14 merged into Step 13. Proceeding to next step.\""
        }
      ]
    },
    "job_15_build_macos_package": {
      "name": "🍎 15 macOS Build, Test, & Package",
      "needs": [
        "job_02_restore_dependencies",
        "job_07b_end_user_e2e"
      ],
      "runs-on": "macos-latest",
      "steps": [
        {
          "name": "💾 Checkout repository",
          "uses": "actions/checkout@v5"
        },
        {
          "name": "⚙️ Setup .NET SDK",
          "uses": "actions/setup-dotnet@v6",
          "with": {
            "global-json-file": "global.json"
          }
        },
        {
          "name": "✅ Run Restore",
          "run": "dotnet restore"
        },
        {
          "name": "🧪 Run Unit & Integration Tests (Lightweight)",
          "run": "dotnet test Application.Tests/Application.Tests.csproj --configuration Release --verbosity normal",
          "env": {
            "ConnectionStrings__DefaultConnection": "Data Source=lightweight_test.db",
            "TelegramPanel__BotToken": "123456:ABC-DEF1234567890",
            "TEST_ENVIRONMENT": "Lightweight",
            "ASPNETCORE_ENVIRONMENT": "Development"
          }
        },
        {
          "name": "💨 Run Smoke Test (macOS)",
          "shell": "bash",
          "run": "echo \"Starting application in the background for smoke test...\"\ndotnet run --project WebAPI/WebAPI.csproj --no-launch-profile --urls \"http://localhost:5000\" > app_output.log 2>&1 &\nAPP_PID=$!\n\necho \"Waiting for application to start (polling http://localhost:5000/healthz)...\"\n\nfor i in {1..30}; do\n  if curl -s --fail http://localhost:5000/healthz > /dev/null; then\n    echo \"✅ Health check passed!\"\n    kill \"$APP_PID\" || true\n    exit 0\n  fi\n  if ! kill -0 \"$APP_PID\" 2>/dev/null; then\n    echo \"❌ Application crashed immediately!\"\n    cat app_output.log\n    exit 1\n  fi\n  echo \"Health check failed. Retrying in 1 second...\"\n  sleep 1\ndone\n\necho \"❌ Health check failed after 30 seconds.\"\ncat app_output.log\nkill \"$APP_PID\" || true\nexit 1\n",
          "env": {
            "IsSmokeTest": "true",
            "ASPNETCORE_ENVIRONMENT": "Development",
            "ConnectionStrings__DefaultConnection": "Data Source=smoke_test.db",
            "TelegramPanel__BotToken": "123456:ABC-DEF1234567890"
          }
        },
        {
          "name": "📦 Publish application",
          "run": "dotnet publish WebAPI/WebAPI.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o ./publish"
        },
        {
          "name": "🏷️ Determine Artifact Name",
          "id": "artifact_name",
          "shell": "bash",
          "run": "if [[ \"${{ github.ref_type }}\" == \"tag\" ]]; then\n  ARTIFACT_FILENAME=\"ForexTradingBot-${{ github.ref_name }}-osx-x64.tar.gz\"\nelse\n  SHORT_SHA=$(echo \"${{ github.sha }}\" | cut -c1-7)\n  ARTIFACT_FILENAME=\"ForexTradingBot-${SHORT_SHA}-osx-x64.tar.gz\"\nfi\necho \"ARTIFACT_FILENAME=${ARTIFACT_FILENAME}\" >> $GITHUB_ENV\n"
        },
        {
          "name": "Compress Artifact",
          "run": "tar -czvf \"${{ env.ARTIFACT_FILENAME }}\" -C ./publish ."
        },
        {
          "name": "⬆️ Upload Build Artifact",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "release-asset-osx-x64",
            "path": "${{ env.ARTIFACT_FILENAME }}"
          }
        }
      ]
    },
    "job_16_package_macos_artifact": {
      "name": "⬆️ 16 Skip (Merged with 15)",
      "needs": "job_15_build_macos_package",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Placeholder for Merged Step",
          "run": "echo \"Step 16 merged into Step 15. Proceeding to next step.\""
        }
      ]
    },
    "job_17_final_cleanup_artifacts": {
      "name": "⬇️ 17 Final Artifact Collection",
      "needs": [
        "job_08_publish_linux_artifact",
        "job_12_docker_push",
        "job_14_package_win_artifact",
        "job_16_package_macos_artifact"
      ],
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Download all release assets",
          "uses": "actions/download-artifact@v8",
          "with": {
            "path": "./release-assets"
          }
        },
        {
          "name": "🔐 Generate SHA-256 checksums",
          "shell": "bash",
          "run": "set -euo pipefail\nfind ./release-assets -type f -not -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > ./release-assets/SHA256SUMS.txt\ncat ./release-assets/SHA256SUMS.txt"
        }
      ]
    },
    "job_18_create_release": {
      "name": "🚀 18 Create GitHub Release",
      "if": "startsWith(github.ref, 'refs/tags/')",
      "needs": "job_17_final_cleanup_artifacts",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "Create GitHub Release",
          "uses": "softprops/action-gh-release@v3",
          "with": {
            "files": "./release-assets/**/*",
            "name": "Release ${{ github.ref_name }}",
            "body": "Automatic release of version ${{ github.ref_name }}. Docker image is available via GHCR.",
            "draft": false,
            "prerelease": false
          },
          "env": {
            "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          }
        }
      ]
    }
  }
}
