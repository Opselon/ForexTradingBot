<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Vault — ForexTradingBot</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3550; --text:#e6ebf5; --dim:#8a97b0; --ok:#4ade80; --bad:#f87171; --accent:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:860px; margin:2rem auto; padding:0 1rem; }
  h1 { font-size:1.35rem; margin:0 0 .25rem; }
  p.sub { color:var(--dim); margin:0 0 1.5rem; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem 1.25rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line); font-size:.9rem; }
  th { color:var(--dim); font-weight:600; text-transform:uppercase; font-size:.72rem; letter-spacing:.05em; }
  .val { font-family:ui-monospace,monospace; color:var(--dim); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:.4rem .85rem; font-size:.85rem; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  button:hover { filter:brightness(1.15); }
  .row-actions { display:flex; gap:.4rem; }
  form.new { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  form.new label { font-size:.78rem; color:var(--dim); display:block; margin-bottom:.2rem; }
  form.new input, form.new select { width:100%; background:#0f1420; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:.45rem .6rem; font-size:.9rem; }
  form.new .full { grid-column:1/-1; }
  .toast { position:fixed; bottom:1rem; right:1rem; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--ok); border-radius:8px; padding:.7rem 1rem; font-size:.88rem; display:none; }
  .toast.err { border-left-color:var(--bad); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
  details.revealed { position:relative; }
  details.revealed summary { list-style:none; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 Secret Vault</h1>
  <p class="sub">Secrets are encrypted at rest on this machine (AES-GCM, machine-derived key) and never leave it. Reveals are audit-logged.</p>

  <div class="toolbar">
    <button onclick="load()">↻ Refresh</button>
    <button class="ghost" onclick="rotate()">🔑 Rotate vault key</button>
  </div>

  <div class="card">
    <table id="tbl">
      <thead><tr><th>Key</th><th>Category</th><th>Updated</th><th>Value</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="empty" style="color:var(--dim);display:none">No secrets stored yet. Add one below, or use <code>forexbot secrets set</code>.</p>
  </div>

  <div class="card">
    <strong style="font-size:.95rem">Add / update a secret</strong>
    <form class="new" onsubmit="save(event)" style="margin-top:.8rem">
      <div><label>Key</label><input id="f-key" placeholder="TELEGRAM_BOT_TOKEN" required></div>
      <div><label>Category</label>
        <select id="f-cat">
          <option>Telegram</option><option>CryptoPay</option><option>Database</option>
          <option>Redis</option><option>Api</option><option>Smtp</option><option selected>Other</option>
        </select>
      </div>
      <div class="full"><label>Value</label><input id="f-val" type="password" placeholder="paste the secret value" required></div>
      <div class="full"><button type="submit">Save secret</button></div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('err', err); t.style.display='block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 3200);
}
async function api(path, opts){
  const r = await fetch('/api/secrets'+path, { credentials:'include', headers:{'Content-Type':'application/json'}, ...opts });
  if (r.status === 401) { location.href = '/login.html'; throw new Error('unauthorized'); }
  if (!r.ok && r.status !== 404) throw new Error(await r.text());
  return r;
}
async function load(){
  const tbody = $('#tbl tbody'); tbody.innerHTML='';
  try {
    const r = await api('');
    const { items } = await r.json();
    $('#empty').style.display = items.length ? 'none' : 'block';
    for (const it of items) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><code>${it.key}</code></td><td>${it.category}</td>` +
        `<td class="val">${new Date(it.updatedUtc).toLocaleString()}</td>` +
        `<td class="val" data-key="${it.key}">${it.value}</td>` +
        `<td><div class="row-actions">
           <button class="ghost" onclick="reveal('${it.key}', this)">reveal</button>
           <button class="danger" onclick="del('${it.key}')">delete</button>
         </div></td>`;
      tbody.appendChild(tr);
    }
  } catch(e){ toast('Failed to load: '+e.message, true); }
}
async function reveal(key, btn){
  const cell = document.querySelector(`td[data-key="${key}"]`);
  if (cell.dataset.open) { cell.textContent = '••••••••'; delete cell.dataset.open; btn.textContent='reveal'; return; }
  try {
    const r = await api(`/${encodeURIComponent(key)}/reveal`);
    const { value } = await r.json();
    cell.textContent = value; cell.dataset.open = '1'; btn.textContent = 'hide';
  } catch(e){ toast(e.status===404 ? 'Not found' : 'Reveal failed', true); }
}
async function del(key){
  if (!confirm(`Delete secret "${key}"? This cannot be undone.`)) return;
  const r = await api('/'+encodeURIComponent(key), { method:'DELETE' });
  toast(r.status===204 ? `Deleted ${key}` : 'Not found', r.status!==204);
  load();
}
async function rotate(){
  if (!confirm('Re-encrypt all secrets with a new salt? Values do not change.')) return;
  const r = await api('/rotate', { method:'POST' });
  const { rotated } = await r.json();
  toast(`Re-encrypted ${rotated} secret(s)`); load();
}
async function save(ev){
  ev.preventDefault();
  const key = $('#f-key').value.trim(), value = $('#f-val').value, category = $('#f-cat').value;
  if (!key || !value) return;
  const r = await api('/'+encodeURIComponent(key), { method:'PUT', body: JSON.stringify({ value, category }) });
  if (r.status===204){ toast(`Saved ${key}`); $('#f-key').value=''; $('#f-val').value=''; load(); }
  else toast('Save failed: '+await r.text(), true);
}
load();
</script>
</body>
</html>
