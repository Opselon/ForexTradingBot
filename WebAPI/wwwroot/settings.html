<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Settings - ForexTradingBot Admin</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/img/favicon.png"> <!-- Adjust path if you have one -->
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Toastr CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">

    <!-- Custom CSS for the full UI overhaul -->
    <style>
        /*
        ================================================================================
        TABLE OF CONTENTS
        ================================================================================
        1.  :root & Theme Variables (Copied from Dashboard)
        2.  Base & Layout Styles (Copied from Dashboard)
        3.  Settings Page Specific Styles
            - Accordion for Categories
            - Setting Item Rows
            - Custom Toggle Switch
            - Overridden Setting Badge
            - Sticky Save/Discard Bar
        4.  Skeleton Loader System
        5.  Responsive Design
        ================================================================================
        */

        /* 1. :root & Theme Variables */
        :root {
            --font-family-sans: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --sidebar-width: 250px;
            --sidebar-width-collapsed: 90px;
            --header-height: 80px;
            --card-border-radius: 16px;
        }

        [data-theme="light"] {
            --bg-main: #f8f9fa;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-header: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --text-tertiary: #adb5bd;
            --border-color: #dee2e6;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --primary-color: #6366f1;
            --primary-color-hover: #4f46e5;
            --primary-color-light: rgba(99, 102, 241, 0.1);
            --info-color: #0dcaf0;
            --info-bg: rgba(13, 202, 240, 0.1);
        }

        [data-theme="dark"] {
            --bg-main: #111827;
            --bg-sidebar: #1f2937;
            --bg-card: #1f2937;
            --bg-header: #111827;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-tertiary: #6b7280;
            --border-color: #374151;
            --shadow-color: rgba(0, 0, 0, 0.2);
            --info-color: #22d3ee;
            --info-bg: rgba(14, 165, 233, 0.1);
        }

        /* 2. Base & Layout Styles */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-family-sans);
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
        }

        main {
            padding: 32px;
            padding-bottom: 100px; /* Space for sticky footer */
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            box-shadow: 0 4px 25px var(--shadow-color);
        }
        /* Copied Layout CSS (Sidebar, Header) */
        #app-layout {
            display: flex;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease-in-out;
            z-index: 1000;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            transition: margin-left 0.3s ease-in-out, width 0.3s ease-in-out;
        }

        body.sidebar-collapsed .sidebar {
            width: var(--sidebar-width-collapsed);
        }

        body.sidebar-collapsed .main-content {
            margin-left: var(--sidebar-width-collapsed);
            width: calc(100% - var(--sidebar-width-collapsed));
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            height: var(--header-height);
            padding: 0 28px;
            flex-shrink: 0;
        }

            .sidebar-header .logo-text {
                font-size: 1.5rem;
                font-weight: 700;
                white-space: nowrap;
                opacity: 1;
                transition: opacity 0.2s ease;
            }

        body.sidebar-collapsed .sidebar-header .logo-text {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar-nav {
            flex-grow: 1;
            padding: 16px;
        }

        .sidebar-nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav-item a {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

            .sidebar-nav-item a .nav-icon {
                font-size: 1.1rem;
                width: 24px;
                margin-right: 20px;
                text-align: center;
                flex-shrink: 0;
            }

            .sidebar-nav-item a .nav-text {
                opacity: 1;
                transition: opacity 0.2s ease;
            }

        body.sidebar-collapsed .sidebar-nav-item a {
            justify-content: center;
        }

            body.sidebar-collapsed .sidebar-nav-item a .nav-text {
                opacity: 0;
                position: absolute;
                pointer-events: none;
            }

        .sidebar-nav-item a.active {
            color: var(--primary-color);
            background-color: var(--primary-color-light);
        }

        .sidebar-nav-item a:hover:not(.active) {
            color: var(--text-primary);
        }

        .sidebar-footer {
            padding: 24px;
            flex-shrink: 0;
        }

        #sidebar-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 100%;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

            #sidebar-toggle:hover {
                border-color: var(--primary-color);
                color: var(--primary-color);
            }

        .main-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 32px;
            position: sticky;
            top: 0;
            background-color: var(--bg-header);
            z-index: 900;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .profile-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

            .profile-btn img {
                width: 36px;
                height: 36px;
                border-radius: 50%;
                object-fit: cover;
            }

        /* 3. Settings Page Specific Styles */
        .settings-accordion .accordion-item {
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--card-border-radius);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .accordion-header {
            padding: 20px 24px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
        }

            .accordion-header h3 {
                font-size: 1.2rem;
                margin: 0;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .accordion-header .fa-chevron-down {
                transition: transform 0.3s ease;
            }

        .accordion-item.open .accordion-header .fa-chevron-down {
            transform: rotate(180deg);
        }

        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out;
            background-color: var(--bg-card);
            padding: 0 24px;
        }

        .accordion-item.open .accordion-body {
            max-height: 1000px; /* Large enough for content */
            padding: 24px;
            border-top: 1px solid var(--border-color);
        }

        .setting-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: flex-start;
            gap: 24px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }

            .setting-item:last-child {
                border-bottom: none;
            }

            .setting-item .label-group {
                display: flex;
                flex-direction: column;
            }

            .setting-item label {
                font-weight: 500;
                margin: 0;
            }

            .setting-item .description {
                font-size: 0.9rem;
                color: var(--text-secondary);
                margin-top: 4px;
            }

            .setting-item .input-wrapper {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                position: relative;
            }

        .form-control {
            display: block;
            width: 100%;
            padding: 10px 16px;
            font-size: 1rem;
            color: var(--text-primary);
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: all .2s ease;
        }

            .form-control:focus {
                outline: 0;
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px var(--primary-color-light);
            }

            .form-control:disabled {
                background-color: var(--border-color);
                cursor: not-allowed;
            }

        .password-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            color: var(--text-tertiary);
            cursor: pointer;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: .4s;
            border-radius: 28px;
        }

            .toggle-slider:before {
                position: absolute;
                content: "";
                height: 20px;
                width: 20px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                transition: .4s;
                border-radius: 50%;
            }

        input:checked + .toggle-slider {
            background-color: var(--primary-color);
        }

            input:checked + .toggle-slider:before {
                transform: translateX(22px);
            }

        .overridden-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            background-color: var(--info-bg);
            color: var(--info-color);
            padding: 4px 10px;
            border-radius: 6px;
            margin-top: 8px;
        }

            .overridden-tag .fa-info-circle {
                cursor: help;
            }

        .sticky-footer-actions {
            position: fixed;
            bottom: 0;
            left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            background-color: var(--bg-card);
            padding: 16px 32px;
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -4px 15px var(--shadow-color);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out, left 0.3s ease-in-out, width 0.3s ease-in-out;
            z-index: 800;
        }

            .sticky-footer-actions.visible {
                transform: translateY(0);
            }

        body.sidebar-collapsed .sticky-footer-actions {
            left: var(--sidebar-width-collapsed);
            width: calc(100% - var(--sidebar-width-collapsed));
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
        }

            .btn-primary:hover:not(:disabled) {
                background-color: var(--primary-color-hover);
            }

            .btn-primary:disabled {
                background-color: var(--primary-color);
                opacity: 0.6;
                cursor: not-allowed;
            }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

            .btn-secondary:hover {
                background-color: var(--bg-main);
                border-color: var(--text-secondary);
            }

        /* 4. Skeleton Loader System */
        .skeleton {
            animation: skeleton-loading 1.5s infinite linear;
            background-color: #e9ecef;
            background-image: linear-gradient(90deg, #e9ecef, #f8f9fa, #e9ecef);
        }

        [data-theme="dark"] .skeleton {
            background-color: #374151;
            background-image: linear-gradient(90deg, #374151, #4b5563, #374151);
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .is-loading .content-loaded {
            visibility: hidden;
        }

        .skeleton-wrapper {
            display: none;
        }

        .is-loading .skeleton-wrapper {
            display: block;
        }

        /* 5. Responsive Design */
        @media (max-width: 992px) { /* Tablet and below */
            body:not(.sidebar-mobile-open) .sidebar {
                transform: translateX(-100%);
            }

            .sidebar {
                position: fixed;
            }

            body.sidebar-mobile-open .sidebar {
                transform: translateX(0);
                box-shadow: 0 0 40px rgba(0,0,0,0.1);
            }

            .main-content, body.sidebar-collapsed .main-content {
                margin-left: 0;
                width: 100%;
            }

            .sticky-footer-actions, body.sidebar-collapsed .sticky-footer-actions {
                left: 0;
                width: 100%;
            }

            #mobile-menu-toggle {
                display: block !important;
            }

            .sidebar-footer {
                display: none;
            }
        }

        @media (max-width: 768px) { /* Mobile */
            main {
                padding: 16px;
                padding-bottom: 100px;
            }

            .page-title {
                font-size: 1.8rem;
            }

            .main-header {
                padding: 0 16px;
            }

            .setting-item {
                grid-template-columns: 1fr;
            }

            .sticky-footer-actions {
                padding: 16px;
            }
        }
    </style>
</head>
<body class="is-loading">

    <div id="app-layout">
        <!-- ======================= Sidebar ======================= -->
        <aside class="sidebar">
            <div class="sidebar-header"><h1 class="logo-text">FTB Admin</h1></div>
            <nav class="sidebar-nav">
                <ul class="sidebar-nav-list">
                    <li class="sidebar-nav-item"><a href="indexapp.html"><i class="fas fa-chart-pie nav-icon"></i><span class="nav-text">Dashboard</span></a></li>
                    <li class="sidebar-nav-item"><a href="/config.html"><i class="fas fa-plug nav-icon"></i><span class="nav-text">Connection Test</span></a></li>
                    <li class="sidebar-nav-item"><a href="/settings.html" class="active"><i class="fas fa-sliders nav-icon"></i><span class="nav-text">App Settings</span></a></li>
                    <li class="sidebar-nav-item"><a href="/status.html"><i class="fas fa-heart-pulse nav-icon"></i><span class="nav-text">System Status</span></a></li>
                    <li class="sidebar-nav-item"><a href="/logs.html"><i class="fas fa-file-lines nav-icon"></i><span class="nav-text">View Logs</span></a></li>
                    <li class="sidebar-nav-item"><a href="/info.html"><i class="fas fa-info-circle nav-icon"></i><span class="nav-text">Info & Help</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <button id="sidebar-toggle" title="Collapse Sidebar"><i class="fas fa-chevron-left toggle-icon"></i></button>
            </div>
        </aside>

        <!-- ======================= Main Content ======================= -->
        <div class="main-content">
            <header class="main-header">
                <button id="mobile-menu-toggle" class="d-lg-none" style="display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-primary);"><i class="fas fa-bars"></i></button>
                <div class="header-actions">
                    <button class="action-btn" id="theme-toggle-btn" title="Toggle Theme"><i class="far fa-sun"></i></button>
                    <button class="action-btn" title="Notifications"><i class="far fa-bell"></i></button>
                    <button class="profile-btn"><img src="https://i.pravatar.cc/36?u=admin" alt="Admin"></button>
                </div>
            </header>

            <main>
                <h2 class="page-title">Application Settings</h2>
                <p class="page-subtitle">Manage dynamic application settings. Overridden values are shown but cannot be changed here.</p>

                <div class="settings-accordion" id="settingsContainer">
                    <!-- Content is dynamically generated by JS -->
                </div>

                <!-- Skeleton Loader for Accordion -->
                <div class="skeleton-wrapper">
                    <div class="skeleton" style="width: 100%; height: 65px; border-radius: var(--card-border-radius); margin-bottom: 16px;"></div>
                    <div class="skeleton" style="width: 100%; height: 65px; border-radius: var(--card-border-radius); margin-bottom: 16px;"></div>
                    <div class="skeleton" style="width: 100%; height: 65px; border-radius: var(--card-border-radius); margin-bottom: 16px;"></div>
                </div>
            </main>
        </div>

        <!-- ======================= Sticky Footer Actions ======================= -->
        <div class="sticky-footer-actions" id="actionsFooter">
            <button class="btn btn-secondary" id="discardButton">Discard</button>
            <button class="btn btn-primary" id="saveButton" disabled>Save Changes</button>
        </div>
    </div>

    <!-- JS Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

    <!-- Dynamic Controller & UI Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- SETTINGS PAGE CONTROLLER ---
            const settingsController = {
                // --- 1. Element Cache ---
                elements: {
                    sidebarToggle: document.getElementById('sidebar-toggle'),
                    mobileMenuToggle: document.getElementById('mobile-menu-toggle'),
                    themeToggleBtn: document.getElementById('theme-toggle-btn'),
                    settingsContainer: document.getElementById('settingsContainer'),
                    actionsFooter: document.getElementById('actionsFooter'),
                    saveButton: document.getElementById('saveButton'),
                    discardButton: document.getElementById('discardButton'),
                },

                // --- 2. State Management ---
                state: {
                    initialSettings: {}, // Will store the initially loaded WebPanelConfigDto
                    currentSettings: {}, // Will store a copy for modifications, maps to WebPanelConfigDto
                    isDirty: false,
                    activeConfigId: null, // To store the ID of the loaded configuration for updates
                    // Defines the structure and metadata for settings to be displayed.
                    // Key maps to a property in WebPanelConfigDto.
                    settingsSchema: [
                        {
                            category: "General",
                            icon: "fa-sliders",
                            settings: [
                                { key: "appName", label: "Application Name", description: "The public name of the application.", type: "text" },
                                { key: "siteTitle", label: "Website Title", description: "The title displayed on the browser tab for admin pages.", type: "text" },
                                { key: "maintenanceMode", label: "Maintenance Mode", description: "Temporarily disable bot functionality for users.", type: "boolean" },
                                { key: "contactEmail", label: "Contact Email", description: "Public contact email for support.", type: "email" },
                            ]
                        },
                        {
                            category: "Display & UI",
                            icon: "fa-palette",
                            settings: [
                                { key: "defaultTheme", label: "Default Theme", description: "Default theme for new users or anonymous access.", type: "select", options: [{value: "light", text: "Light"}, {value: "dark", text: "Dark"}] },
                                { key: "defaultPageSize", label: "Default Page Size", description: "Default number of items per page in tables.", type: "number", min: 5, max: 100 },
                                { key: "maxLogEntriesToDisplay", label: "Max Log Entries (UI)", description: "Maximum log entries to show in UI log viewers.", type: "number", min:10, max:1000 },
                            ]
                        },
                        {
                            category: "Telegram Bot",
                            icon: "fa-telegram",
                            settings: [
                                // BotToken is managed on config.html for now due to its sensitivity and test button
                                // { key: "telegramBotToken", label: "Bot Token", description: "The API token for your Telegram bot.", type: "password" },
                                { key: "adminChatId", label: "Admin Chat ID", description: "The Telegram Chat ID for receiving admin notifications.", type: "text" }
                            ]
                        },
                        {
                            category: "Security",
                            icon: "fa-shield-halved",
                            settings: [
                                { key: "sessionTimeoutMinutes", label: "Session Timeout (Minutes)", description: "Duration of an inactive admin session before automatic logout.", type: "number", min: 5, max: 1440 }
                            ]
                        },
                        {
                            category: "Feature Flags",
                            icon: "fa-toggle-on",
                            settings: [
                                { key: "isFeatureXEnabled", label: "Enable Feature X", description: "Toggle for experimental Feature X.", type: "boolean" },
                                { key: "isFeatureYEnabled", label: "Enable Feature Y", description: "Toggle for experimental Feature Y.", type: "boolean" },
                            ]
                        }
                        // Add more categories and settings here as needed
                        // {
                        //     category: "Connection Strings",
                        //     icon: "fa-plug",
                        //     settings: [
                        //         { key: "databaseConnectionString", label: "Database Connection", description: "Primary DB connection string.", type: "password" },
                        //         { key: "redisConnectionString", label: "Redis Connection", description: "Redis cache connection string.", type: "text" },
                        //     ]
                        // }
                    ]
                },

                // --- 3. Initialization ---
                init() {
                    console.log("Controller: Initializing Settings Page...");
                    this.initUI();
                    this.bindEvents();
                    this.loadSettings();
                },

                initUI() {
                    const savedTheme = localStorage.getItem('theme') || 'light';
                    this.applyTheme(savedTheme);
                },

                // --- 5. Event Binding ---
                bindEvents() {
                    // Layout events
                    this.elements.sidebarToggle?.addEventListener('click', () => document.body.classList.toggle('sidebar-collapsed'));
                    this.elements.mobileMenuToggle?.addEventListener('click', () => document.body.classList.toggle('sidebar-mobile-open'));
                    this.elements.themeToggleBtn?.addEventListener('click', () => this.toggleTheme());

                    // Page-specific events using delegation
                    this.elements.settingsContainer.addEventListener('click', (e) => {
                        if (e.target.closest('.accordion-header')) this.toggleAccordion(e.target.closest('.accordion-item'));
                        if (e.target.closest('.password-toggle')) this.togglePasswordVisibility(e.target);
                    });
                    this.elements.settingsContainer.addEventListener('change', (e) => this.handleSettingChange(e));

                    this.elements.saveButton.addEventListener('click', () => this.handleSave());
                    this.elements.discardButton.addEventListener('click', () => this.handleDiscard());
                },

                // --- 6. Core Logic / "Controller" Actions ---
                applyTheme(theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('theme', theme);
                    const icon = this.elements.themeToggleBtn.querySelector('i');
                    icon.className = theme === 'dark' ? 'far fa-moon' : 'far fa-sun';
                },

                toggleTheme() {
                    const newTheme = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                    this.applyTheme(newTheme);
                },

                async loadSettings() {
                    console.log("Controller: Loading settings from /api/webpanelconfig...");
                    document.body.classList.add('is-loading');
                    try {
                        const response = await fetch('/api/webpanelconfig'); // Get active config
                        if (response.ok) {
                            const configDto = await response.json();
                            this.state.initialSettings = { ...configDto }; // Store a copy
                            this.state.currentSettings = { ...configDto }; // Working copy
                            this.state.activeConfigId = configDto.id;

                            this.renderSettingsFromSchema();
                            toastr.info('Settings loaded.', 'System Ready');
                            console.log("Controller: Settings loaded:", configDto);
                        } else if (response.status === 404) {
                            toastr.error('No active configuration found. Please configure and save on the Connection Setup page first.', 'Configuration Missing');
                            console.error("Controller: No active configuration found. Cannot load settings.");
                            // Disable save, or handle creation here if this page could create the first config.
                            // For now, assume config.html creates the initial record.
                            this.elements.saveButton.disabled = true;
                        } else {
                            toastr.error(`Error loading settings: ${response.statusText}`, 'Load Error');
                            console.error("Controller: Error loading settings:", response);
                        }
                    } catch (error) {
                        toastr.error('Could not connect to backend to load settings.', 'Network Error');
                        console.error("Controller: Network error loading settings:", error);
                    } finally {
                        setTimeout(() => document.body.classList.remove('is-loading'), 200);
                    }
                },

                renderSettingsFromSchema() {
                    let html = '';
                    this.state.settingsSchema.forEach((category, index) => {
                        // Filter settings in this category that actually exist as properties in currentSettings (WebPanelConfigDto)
                        const relevantSettings = category.settings.filter(s => this.state.currentSettings.hasOwnProperty(s.key));
                        if (relevantSettings.length === 0) return; // Skip category if no relevant settings

                        html += `
                                <div class="accordion-item" id="category-${index}">
                                    <div class="accordion-header">
                                        <h3><i class="fa-solid ${category.icon}"></i> ${category.category}</h3>
                                        <i class="fa-solid fa-chevron-down"></i>
                                    </div>
                                    <div class="accordion-body">
                                        ${relevantSettings.map(s => this.renderSettingItemFromSchema(s)).join('')}
                                    </div>
                                </div>
                            `;
                    });
                    this.elements.settingsContainer.innerHTML = html;
                },

                renderSettingItemFromSchema(settingSchemaItem) {
                    const { key, label, description, type, options, min, max } = settingSchemaItem;
                    const value = this.state.currentSettings[key]; // Get value from the loaded DTO
                    // isOverridden logic would need to come from backend if we support it for these fields
                    const isOverridden = false; // Assuming not overridden for these general settings for now
                    const disabledAttr = isOverridden ? 'disabled' : '';
                    let inputHtml = '';

                    switch (type) {
                        case 'boolean':
                            inputHtml = `
                                <label class="toggle-switch">
                                    <input type="checkbox" data-key="${key}" ${value ? 'checked' : ''} ${disabledAttr}>
                                    <span class="toggle-slider"></span>
                                </label>`;
                            break;
                        case 'password': // Example, though not used in current settingsSchema for WebPanelConfig
                            inputHtml = `
                                <div style="position: relative; width: 100%;">
                                    <input type="password" class="form-control" data-key="${key}" value="${value || ''}" ${disabledAttr} placeholder="Enter new value to change">
                                    ${!isOverridden ? '<i class="fa-solid fa-eye password-toggle"></i>' : ''}
                                </div>`;
                            break;
                        case 'select':
                            const selectOptions = options.map(opt => `<option value="${opt.value}" ${opt.value == value ? 'selected' : ''}>${opt.text}</option>`).join('');
                            inputHtml = `<select class="form-control" data-key="${key}" ${disabledAttr}>${selectOptions}</select>`;
                            break;
                        case 'number':
                             inputHtml = `<input type="number" class="form-control" data-key="${key}" value="${value || ''}" ${min ? `min="${min}"` : ''} ${max ? `max="${max}"` : ''} ${disabledAttr}>`;
                            break;
                        case 'email':
                             inputHtml = `<input type="email" class="form-control" data-key="${key}" value="${value || ''}" ${disabledAttr}>`;
                            break;
                        default: // text
                            inputHtml = `<input type="text" class="form-control" data-key="${key}" value="${value || ''}" ${disabledAttr}>`;
                    }

                    const overriddenHtml = isOverridden ? `
                        <div class="overridden-tag">
                            <i class="fa-solid fa-info-circle" title="This value may be set by an environment variable and might not be changeable here."></i>
                            <span>Potentially Overridden</span>
                        </div>` : '';

                    return `
                        <div class="setting-item">
                            <div class="label-group">
                                <label for="${key}">${label}</label>
                                <p class="description">${description}</p>
                            </div>
                            <div class="input-wrapper">
                                ${inputHtml}
                                ${overriddenHtml}
                            </div>
                        </div>`;
                },

                toggleAccordion(item) { item.classList.toggle('open'); },

                togglePasswordVisibility(toggleIcon) {
                    const input = toggleIcon.previousElementSibling;
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    toggleIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
                },

                handleSettingChange(event) {
                    const input = event.target;
                    const key = input.dataset.key;
                    if (!key || !this.state.currentSettings.hasOwnProperty(key)) return;

                    let value = input.type === 'checkbox' ? input.checked : input.value;
                    if (input.type === 'number') {
                        value = parseFloat(value);
                        if (isNaN(value)) { // Handle invalid number input if necessary
                           // toastr.warning(`Invalid number for ${key}`);
                           return; // Or revert to initialSettings[key]
                        }
                    }

                    this.state.currentSettings[key] = value;
                    this.checkDirtyState();
                },

                checkDirtyState() {
                    // Compare currentSettings with initialSettings, only for keys defined in schema
                    let changed = false;
                    for (const category of this.state.settingsSchema) {
                        for (const setting of category.settings) {
                            if (this.state.currentSettings.hasOwnProperty(setting.key) &&
                                this.state.initialSettings.hasOwnProperty(setting.key) &&
                                this.state.currentSettings[setting.key] !== this.state.initialSettings[setting.key]) {
                                changed = true;
                                break;
                            }
                        }
                        if (changed) break;
                    }
                    this.state.isDirty = changed;
                    this.elements.actionsFooter.classList.toggle('visible', this.state.isDirty);
                    this.elements.saveButton.disabled = !this.state.isDirty;
                },

                async handleSave() {
                    if (!this.state.activeConfigId) {
                        toastr.error("Cannot save settings: No active configuration loaded. Please use Connection Setup page first.", "Error");
                        return;
                    }

                    console.log("Controller: Saving changes...", this.state.currentSettings);
                    this.elements.saveButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Saving...`;
                    this.elements.saveButton.disabled = true;

                    // Construct the UpdateWebPanelConfigDto. It should match the full WebPanelConfigDto structure.
                    const payload = { ...this.state.initialSettings, ...this.state.currentSettings, id: this.state.activeConfigId };

                    // Mask sensitive data for logging
                    const payload_to_log = {...payload};
                    if (payload_to_log.telegramBotToken) payload_to_log.telegramBotToken = "****";
                    if (payload_to_log.databaseConnectionString) payload_to_log.databaseConnectionString = "****";
                    console.log("Controller: Sending PUT to /api/webpanelconfig/" + this.state.activeConfigId, payload_to_log);


                    try {
                        const response = await fetch(`/api/webpanelconfig/${this.state.activeConfigId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            toastr.success('Settings saved successfully!');
                            this.state.initialSettings = { ...this.state.currentSettings }; // Update base state
                            this.checkDirtyState(); // Will hide footer and disable save
                        } else {
                            const errorData = await response.text();
                            toastr.error(`Failed to save settings: ${response.status} ${errorData}`, 'Save Error');
                            console.error("Controller: Save error - ", errorData);
                            this.elements.saveButton.disabled = false; // Re-enable on error
                        }
                    } catch (error) {
                        toastr.error('An unexpected error occurred while saving settings.', 'Network Error');
                        console.error("Controller: Network error saving settings - ", error);
                        this.elements.saveButton.disabled = false; // Re-enable on error
                    } finally {
                         this.elements.saveButton.innerHTML = `Save Changes`;
                    }
                },

                handleDiscard() {
                    console.log("Controller: Discarding changes.");
                    this.state.currentSettings = { ...this.state.initialSettings };
                    this.renderSettingsFromSchema(); // Re-render to reset view
                    this.checkDirtyState(); // This will hide the footer
                }
                // Removed flattenSettings as it's not needed with the new schema-driven approach
            };

            // --- Run the Controller ---
            settingsController.init();
        });
    </script>
</body>
</html>
