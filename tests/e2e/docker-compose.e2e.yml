services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: forexbot
      POSTGRES_PASSWORD: e2e-postgres-password
      POSTGRES_DB: forexbotdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forexbot -d forexbotdb"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [e2e]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [e2e]

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      CI: "false"
      IsSmokeTest: "false"
      FOREXBOT_VAULT_DIRECTORY: /app/data/vault
      DatabaseSettings__DatabaseProvider: postgres
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=forexbotdb;Username=forexbot;Password=e2e-postgres-password
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Admin__Username: admin
      TelegramPanel__BotToken: ""
      TelegramPanel__AdminUserIds: ""
      CryptoPay__ApiToken: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "18080:80"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30
    networks: [e2e]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: E2e-SqlServer-Password-123!
    ports:
      - "11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'E2e-SqlServer-Password-123!' -C -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [e2e]

networks:
  e2e:
    driver: bridge

volumes:
  app_data:
